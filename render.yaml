# Blueprint de Render: New > Blueprint > seleccionar este repositorio.
services:
  - type: web
    name: peaje-ia
    runtime: docker
    rootDir: web
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - { key: APP_ENV, value: production }
      - { key: APP_DEBUG, value: "false" }
      - { key: APP_KEY, sync: false }
      - { key: APP_URL, sync: false }
      - { key: APP_LOCALE, value: es }
      - { key: APP_TIMEZONE, value: America/La_Paz }
      - { key: LOG_CHANNEL, value: stderr }
      - { key: DB_CONNECTION, value: pgsql }
      - { key: DB_URL, sync: false }
      - { key: SESSION_DRIVER, value: database }
      - { key: SESSION_SECURE_COOKIE, value: "true" }
      - { key: CACHE_STORE, value: database }
      - { key: QUEUE_CONNECTION, value: sync }
      - { key: BROADCAST_CONNECTION, value: pusher }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: GOOGLE_REDIRECT_URI, sync: false }
      - { key: GOOGLE_ALLOWED_AUDIENCES, sync: false }
      - { key: ADMIN_EMAILS, sync: false }
      - { key: PUSHER_APP_ID, sync: false }
      - { key: PUSHER_APP_KEY, sync: false }
      - { key: PUSHER_APP_SECRET, sync: false }
      - { key: PUSHER_APP_CLUSTER, value: us2 }
      - { key: INFERENCE_URL, sync: false }
      - { key: INFERENCE_API_KEY, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GEMINI_MODEL, value: gemini-3.5-flash }
